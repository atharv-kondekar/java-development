<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>Music</title>
		<link rel="stylesheet" th:href="@{/css/albumSongs.css}">
	</head>
	<body>
		<h1>Sunbeam online Music <br>
			Hello , <span th:text="${session.user.name}"></span>
		</h1>
		<table border="1">
			<thead>
				<tr>
					<th>Song id</th>
					<th>title</th>
					<th>file</th>
					<th>duration</th>
					<th>albumId</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="song:${songs}">
					<td th:text="${song.id}"></td>
					<td th:text="${song.title}"></td>
					<td th:text="${song.file}"></td>
					<td th:text="${song.duration}"></td>
					<td th:text="${song.albumId}"></td>
				</tr>
			</tbody>
		</table>

	</body>
</html>
