<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
	    <meta charset="UTF-8">
	    <title>Music</title>

	    <link rel="stylesheet" th:href="@{/css/albums.css}">
	</head>
	<body>
		<h1>Sunbeam online Music <br>
			Hello , <span th:text="${session.user.name}"></span>
		</h1>
		<table border="1">
			<thead>
				<tr>
					<th>Album id</th>
					<th>Title</th>
					<th>Thumnail</th>
					<th>Action</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="album:${albums}">
					<td th:text="${album.id}"></td>
					<td th:text="${album.title}"></td>
					<td th:text="${album.thumbnail}"></td>
					<td>
						<a th:href="@{/songManagement(albumId=${album.id})}">
							View Songs
						</a>
					</td>
				</tr>
			</tbody>
		</table>

		<!--
		<br>
		<form method="post" action="/songManagement">
			<input type="number" placeholder="Enter Album id" required name="albumId"> &nbsp;
			<button>Submit</button>
		</form>
		-->
	</body>
</html>
