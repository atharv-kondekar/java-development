spring.application.name=ai01-openai-groq

# open-ai java library is by default configured to connect the openai.com server & use OPENAI_API_KEY
# -> NOw Programmer can only select the model to communicate e.g. GPT 5.0

# to opean ai java library to communicate with other compatible servers,
# the programmer need to set the "server base url, llm model and api key"

spring.ai.openai.chat.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.model=openai/gpt-oss-120b