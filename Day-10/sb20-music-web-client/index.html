<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            padding: 30px;
            width: 300px;
            box-shadow: 0 2px 10px #ccc;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        #error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h2>Login</h2>

    <form id="loginForm">
        <input type="text" id="email" placeholder="Email" required>
        <input type="password" id="passwd" placeholder="Password" required>

        <button type="submit">Sign In</button>
    </form>

    <div id="error"></div>
</div>

<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const credentials = {

            email:
                document.getElementById("email").value,

            password:
                document.getElementById("passwd").value

        };


        fetch(
            "http://localhost:8081/users/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(credentials)
            }
        )

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Invalid username or password"
                );

            }

            return response.json();

        })

        .then(result => {

            console.log(
                "Login response:",
                result
            );


            const user =
                result.data;


            if (!user) {

                throw new Error(
                    "Invalid login response"
                );

            }


            // =========================
            // SAVE USER SESSION
            // =========================

            sessionStorage.setItem(
                "user",
                JSON.stringify(user)
            );


            // =========================
            // REDIRECT BASED ON ROLE
            // =========================

            if (
                user.role === "ROLE_ADMIN"
            ) {

                window.location.href =
                    "users.html";

            }

            else {

                window.location.href =
                    "albums.html";

            }

        })

        .catch(error => {

            console.error(
                "Login Error:",
                error
            );

            document.getElementById("error")
                .textContent =
                error.message;

        });

    });

</script>
</body>
</html>
